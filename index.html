<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tadee Analyser</title>
  <link rel="stylesheet" href="https://unpkg.com/98.css" />
  <link rel="stylesheet" href="css/desktop.css" />
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.163.0/build/three.module.js" } }
  </script>
</head>
<body>

<div id="viewport"></div>

<!-- Taskbar — OS-level UI, outside #viewport -->
<div id="taskbar">
  <button id="start-btn">Start</button>
  <div id="task-area"></div>
  <div id="clock"></div>
</div>

<!-- Start menu — positioned above taskbar -->
<div id="start-menu" hidden>
  <div id="start-menu-inner">
    <button class="start-menu-item">Programs</button>
    <button class="start-menu-item">Documents</button>
    <button class="start-menu-item">Settings</button>
    <hr class="start-menu-separator" />
    <button class="start-menu-item">Shut Down</button>
  </div>
</div>

<script type="module" src="js/ui/components/taskbar.js"></script>

</body>
</html>
