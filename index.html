<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tadee Analyser</title>
  <link rel="stylesheet" href="https://unpkg.com/98.css" />
  <style>
    /* ── Scrolling: instant everywhere ─────────────────────────────────────── */
    html { scroll-behavior: auto; }
    * { scroll-behavior: auto !important; }

    /* ── Font: defined globally — never per-component ─────────────────────────── */
    /* Matches 98.css body declaration; ensures font is set even before CDN loads.
       The inherit rule forces it into button/input/select which have UA overrides. */
    body { font-family: Arial; font-size: 12px; }
    *, *::before, *::after { font-family: inherit; font-size: inherit; }

    /* ── Base layout ─────────────────────────────────────────────────────── */
    body {
      margin: 0;
      padding: 0;
      background: teal;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Desktop: fills all space above the taskbar ──────────────────────── */
    #desktop {
      flex: 1 1 auto;
      position: relative;
      overflow: hidden;
    }

    /* ── Taskbar: OS-level UI, always at the bottom ──────────────────────── */
    #taskbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 4px;
      height: 28px;
      box-sizing: border-box;
      background: silver;
      box-shadow: inset -1px -1px #0a0a0a,
                  inset  1px  1px #ffffff,
                  inset -2px -2px grey,
                  inset  2px  2px #dfdfdf;
      position: relative; /* anchor for #start-menu */
    }

    /* ── Start button: content-sized, icon + text layout ─────────────────── */
    #start-btn {
      font-weight: bold;
      min-width: unset;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 0 6px;
    }

    /* Win98 Windows logo: 4-color 2×2 grid, CSS-only ─────────────────────── */
    .start-icon {
      display: inline-block;
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      background:
        linear-gradient(#f00, #f00)   0    0    / 6px 6px,
        linear-gradient(#0c0, #0c0)   8px  0    / 6px 6px,
        linear-gradient(#00f, #00f)   0    8px  / 6px 6px,
        linear-gradient(#fc0, #fc0)   8px  8px  / 6px 6px;
      background-repeat: no-repeat;
    }

    /* ── Task area: window buttons go here in future ─────────────────────── */
    #task-area {
      flex: 1 1 auto;
    }

    /* ── System tray / clock ─────────────────────────────────────────────── */
    #taskbar-clock {
      flex: 0 0 auto;
      align-self: stretch;      /* fill full taskbar height */
      display: flex;
      align-items: center;
      padding: 0 6px;
      font-size: 11px;
      box-shadow: inset -1px -1px #ffffff,
                  inset  1px  1px #0a0a0a,
                  inset -2px -2px #dfdfdf,
                  inset  2px  2px grey;
      white-space: nowrap;
    }

    /* ── Start menu ──────────────────────────────────────────────────────── */
    #start-menu {
      display: none; /* toggled by JS — no animation */
      position: absolute;
      bottom: 100%; /* flush above taskbar */
      left: 0;
      z-index: 9999;
      min-width: 160px;
      background: silver;
      box-shadow: inset -1px -1px #0a0a0a,
                  inset  1px  1px #ffffff,
                  inset -2px -2px grey,
                  inset  2px  2px #dfdfdf;
    }

    #start-menu.open {
      display: block;
    }

    #start-menu ul {
      list-style: none;
      margin: 0;
      padding: 2px 0;
    }

    /* Outer li: no padding or background — bevel of parent must stay intact */
    #start-menu li {
      padding: 0;
      cursor: default;
      white-space: nowrap;
    }

    /* Inner element carries padding AND highlight — never overlaps bevel ──── */
    #start-menu .menu-item-inner {
      display: block;
      padding: 4px 24px 4px 12px;
      font-size: 11px;
    }

    #start-menu li:hover .menu-item-inner {
      background: navy;
      color: #fff;
    }

    #start-menu hr {
      border: none;
      border-top: 1px solid grey;
      margin: 3px 4px;
    }
  </style>
</head>
<body>

  <!-- Desktop: application windows are appended here by the window manager -->
  <div id="desktop"></div>

  <!-- Taskbar: OS-level UI — outside #desktop, always at the bottom -->
  <div id="taskbar">
    <button id="start-btn"><span class="start-icon" aria-hidden="true"></span><span>Start</span></button>
    <div id="task-area"></div>
    <div id="taskbar-clock">00:00</div>

    <!-- Start menu: positioned above taskbar via CSS, anchored to #taskbar -->
    <div id="start-menu" role="menu" aria-label="Start Menu">
      <ul>
        <li role="menuitem"><span class="menu-item-inner">Programs</span></li>
        <li role="menuitem"><span class="menu-item-inner">Documents</span></li>
        <li role="menuitem"><span class="menu-item-inner">Settings</span></li>
        <hr />
        <li role="menuitem"><span class="menu-item-inner">Shut Down…</span></li>
      </ul>
    </div>
  </div>

  <script type="module" src="js/ui/components/taskbar.js"></script>
</body>
</html>
