<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TADEE Group 7</title>
  <link rel="stylesheet" href="https://unpkg.com/98.css" />
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.163.0/build/three.module.js" } }
  </script>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
<div id="viewport">

  <!-- Desktop icon layer -->
  <div id="desktop"></div>

  <!-- Transmission Line Analyzer window -->
  <div id="win-notepad" class="window" data-start-hidden="true" style="width: 900px; height: 580px;">
    <div class="title-bar">
      <div class="title-bar-text">Transmission Line Analyzer</div>
      <div class="title-bar-controls">
        <button aria-label="Minimize"></button>
        <button aria-label="Maximize"></button>
        <button aria-label="Close"></button>
      </div>
    </div>

    <nav class="menu-bar" id="menu-bar">
      <div class="menu-item" data-menu="file">
        <button>File</button>
        <div class="dropdown">
          <div class="dropdown-inner">
            <button class="dropdown-item">New</button>
            <button class="dropdown-item">Open…</button>
            <button class="dropdown-item">Save</button>
            <button class="dropdown-item">Save As…</button>
            <hr class="dropdown-separator" />
            <button class="dropdown-item">Print…</button>
            <hr class="dropdown-separator" />
            <button class="dropdown-item">Exit</button>
          </div>
        </div>
      </div>
      <div class="menu-item" data-menu="edit">
        <button>Edit</button>
        <div class="dropdown">
          <div class="dropdown-inner">
            <button class="dropdown-item" disabled>Undo</button>
            <hr class="dropdown-separator" />
            <button class="dropdown-item">Cut</button>
            <button class="dropdown-item">Copy</button>
            <button class="dropdown-item">Paste</button>
            <button class="dropdown-item">Delete</button>
            <hr class="dropdown-separator" />
            <button class="dropdown-item">Select All</button>
          </div>
        </div>
      </div>
      <div class="menu-item" data-menu="view">
        <button>View</button>
        <div class="dropdown">
          <div class="dropdown-inner">
            <button class="dropdown-item dropdown-check" data-checked="true" id="view-pane-input">Input pane</button>
            <button class="dropdown-item dropdown-check" data-checked="true" id="view-pane-canvas">Canvas pane</button>
            <button class="dropdown-item dropdown-check" data-checked="true" id="view-pane-output">Output pane</button>
          </div>
        </div>
      </div>
      <div class="menu-item" data-menu="tools">
        <button>Tools</button>
        <div class="dropdown">
          <div class="dropdown-inner">
            <button class="dropdown-item">Options…</button>
            <button class="dropdown-item">Preferences…</button>
          </div>
        </div>
      </div>
      <div class="menu-item" data-menu="help">
        <button>Help</button>
        <div class="dropdown">
          <div class="dropdown-inner">
            <button class="dropdown-item">Help Topics</button>
            <hr class="dropdown-separator" />
            <button class="dropdown-item">About Notepad</button>
          </div>
        </div>
      </div>
    </nav>

    <div class="toolbar">
      <button id="btn-compute"    data-tooltip="Run the transmission line computation">Compute</button>
      <div class="toolbar-separator"></div>
      <button id="btn-save-input" data-tooltip="Save current input parameters to a file">Save Input</button>
      <button id="btn-load-input" data-tooltip="Load input parameters from a file">Load Input</button>
      <div class="toolbar-separator"></div>
      <button id="btn-batch-mode" data-tooltip="Run computations over a range of parameter values">Batch Mode</button>
      <div class="toolbar-separator"></div>
      <button id="btn-view-code" data-tooltip="View generated source code">View Code</button>
      <button id="btn-view-calc" data-tooltip="Show the formulae used and the calculations">View Calculations</button>
    </div>

    <!-- Panel layout: left+right side by side, bottom full-width -->
    <div class="window-body" style="padding: 4px;">
      <div id="panel-layout">

        <!-- Top row: left + right panels with vertical splitter -->
        <div id="panel-top-row">
          <div id="panel-left">
            <div class="panel-content">
            <form id="input-form" style="font-size:11px;">

              <fieldset>
                <legend>Electrical Parameters</legend>
                <div class="field-row-stacked">
                  <label for="line-length">Line length</label>
                  <div class="unit-input-row">
                    <input id="line-length" type="number" min="0" step="any" />
                    <select id="line-length-unit" data-unit-for="line-length" data-base-unit="km">
                      <option value="m"    data-to-base="0.001">m</option>
                      <option value="km"   data-to-base="1" selected>km</option>
                      <option value="mile" data-to-base="1.60934">mile</option>
                    </select>
                  </div>
                </div>
                <div class="field-row-stacked" style="margin-top:4px;">
                  <label for="load-mw">Receiving end load</label>
                  <div class="unit-input-row">
                    <input id="load-mw" type="number" min="0" step="any" />
                    <select id="load-mw-unit" data-unit-for="load-mw" data-base-unit="MW">
                      <option value="W"  data-to-base="0.000001">W</option>
                      <option value="kW" data-to-base="0.001">kW</option>
                      <option value="MW" data-to-base="1" selected>MW</option>
                    </select>
                  </div>
                </div>
                <div class="field-row-stacked" style="margin-top:4px;">
                  <label for="power-factor">Power factor</label>
                  <input id="power-factor" type="number" min="0" max="1" step="0.01" />
                </div>
                <div class="field-row-stacked" style="margin-top:4px;">
                  <label for="voltage">Nominal voltage</label>
                  <div class="unit-input-row">
                    <input id="voltage" type="number" min="0" step="any" />
                    <select id="voltage-unit" data-unit-for="voltage" data-base-unit="kV">
                      <option value="V"  data-to-base="0.001">V</option>
                      <option value="kV" data-to-base="1" selected>kV</option>
                    </select>
                  </div>
                </div>
                <div class="field-row-stacked" style="margin-top:4px;">
                  <label for="frequency">Frequency (Hz)</label>
                  <input id="frequency" type="number" min="0" step="any" value="50" />
                </div>
                <div class="field-row-stacked" style="margin-top:4px;">
                  <label for="system-type">System type</label>
                  <select id="system-type">
                    <option>Symmetrical</option>
                    <option>Unsymmetrical</option>
                  </select>
                </div>
              </fieldset>

              <fieldset style="margin-top:6px;">
                <legend>Geometry Parameters</legend>
                <!-- Symmetric spacing (single D) -->
                <div id="spacing-sym">
                  <div class="field-row-stacked">
                    <label for="phase-spacing">Phase spacing D</label>
                    <div class="unit-input-row">
                      <input id="phase-spacing" type="number" min="0" step="any" />
                      <select id="phase-spacing-unit" data-unit-for="phase-spacing" data-base-unit="m">
                        <option value="cm" data-to-base="0.01">cm</option>
                        <option value="m"  data-to-base="1" selected>m</option>
                      </select>
                    </div>
                  </div>
                </div>
                <!-- Unsymmetric spacing (Dab, Dbc, Dca) -->
                <div id="spacing-unsym" style="display:none;">
                  <div class="field-row-stacked">
                    <label for="dab">Dab</label>
                    <div class="unit-input-row">
                      <input id="dab" type="number" min="0" step="any" />
                      <select id="dab-unit" data-unit-for="dab" data-base-unit="m">
                        <option value="cm" data-to-base="0.01">cm</option>
                        <option value="m"  data-to-base="1" selected>m</option>
                      </select>
                    </div>
                  </div>
                  <div class="field-row-stacked" style="margin-top:4px;">
                    <label for="dbc">Dbc</label>
                    <div class="unit-input-row">
                      <input id="dbc" type="number" min="0" step="any" />
                      <select id="dbc-unit" data-unit-for="dbc" data-base-unit="m">
                        <option value="cm" data-to-base="0.01">cm</option>
                        <option value="m"  data-to-base="1" selected>m</option>
                      </select>
                    </div>
                  </div>
                  <div class="field-row-stacked" style="margin-top:4px;">
                    <label for="dca">Dca</label>
                    <div class="unit-input-row">
                      <input id="dca" type="number" min="0" step="any" />
                      <select id="dca-unit" data-unit-for="dca" data-base-unit="m">
                        <option value="cm" data-to-base="0.01">cm</option>
                        <option value="m"  data-to-base="1" selected>m</option>
                      </select>
                    </div>
                  </div>
                </div>
                <div class="field-row-stacked" style="margin-top:4px;">
                  <label for="bundle-count">Sub-conductor count</label>
                  <select id="bundle-count">
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                  </select>
                </div>
                <div class="field-row-stacked" style="margin-top:4px;">
                  <label for="sub-spacing">Sub-conductor spacing</label>
                  <div class="unit-input-row">
                    <input id="sub-spacing" type="number" min="0" step="any" />
                    <select id="sub-spacing-unit" data-unit-for="sub-spacing" data-base-unit="m">
                      <option value="cm" data-to-base="0.01">cm</option>
                      <option value="m"  data-to-base="1" selected>m</option>
                    </select>
                  </div>
                </div>
              </fieldset>

              <fieldset style="margin-top:6px;">
                <legend>Conductor Parameters</legend>
                <div class="field-row-stacked">
                  <label for="strands">Number of strands</label>
                  <input id="strands" type="number" min="1" step="1" />
                </div>
                <div class="field-row-stacked" style="margin-top:4px;">
                  <label for="dia-strands">Strand diameter</label>
                  <div class="unit-input-row">
                    <input id="dia-strands" type="number" min="0" step="any" />
                    <select id="dia-strands-unit" data-unit-for="dia-strands" data-base-unit="m">
                      <option value="mm" data-to-base="0.001">mm</option>
                      <option value="cm" data-to-base="0.01">cm</option>
                      <option value="m"  data-to-base="1" selected>m</option>
                    </select>
                  </div>
                </div>
                <div class="field-row-stacked" style="margin-top:4px;">
                  <label for="resistance">Resistance</label>
                  <div class="unit-input-row">
                    <input id="resistance" type="number" min="0" step="any" />
                    <select id="resistance-unit" data-unit-for="resistance" data-base-unit="ohm/km">
                      <option value="ohm/m"  data-to-base="1000">Ω/m</option>
                      <option value="ohm/km" data-to-base="1" selected>Ω/km</option>
                    </select>
                  </div>
                </div>
              </fieldset>

              <fieldset style="margin-top:6px;">
                <legend>Model Selection</legend>
                <div class="field-row-stacked">
                  <label for="line-model">Line model</label>
                  <select id="line-model">
                    <option>Short</option>
                    <option>Nominal π</option>
                    <option>Distributed</option>
                  </select>
                </div>
              </fieldset>

            </form>
            </div>
          </div>
          <div class="splitter-v" id="splitter-v"></div>
          <div id="panel-right">
            <div id="canvas-container"></div>
          </div>
        </div>

        <!-- Horizontal splitter -->
        <div class="splitter-h" id="splitter-h"></div>

        <!-- Bottom: Results panel -->
        <div id="panel-bottom">
          <div id="results-heading">Results</div>
          <div id="results-scroll">
            <div id="results-grid"></div>
          </div>
        </div>

      </div>
    </div>
    <!-- Window-level status bar (98.css classes) -->
    <div class="status-bar">
      <p class="status-bar-field" id="sb-hover"></p>
      <p class="status-bar-field" id="sb-time">Time: 0 ms</p>
      <p class="status-bar-field" id="sb-status">Ready</p>
    </div>
  </div>

  <script type="module" src="js/windowManager.js"></script>
  <script type="module" src="js/analyzer.js"></script>
  <script type="module" src="js/desktop.js"></script>
</div><!-- /#viewport -->

<div id="taskbar">
  <button id="start-btn">
    <span class="start-icon" aria-hidden="true"></span>
    Start
  </button>
  <div id="taskbar-sep"></div>
  <div id="taskbar-tasks"></div>
  <div id="taskbar-tray">
    <div id="taskbar-clock"></div>
  </div>
</div>

  <script type="module" src="js/taskbar.js"></script>
</body>
</html>
